<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" width="600" height="660" role="img" aria-labelledby="t d">
<title id="t">Edam KETATA — Transforming data into intelligence</title><desc id="d">Dark banner with slow aurora light in cyan, blue and violet. Dimension nodes send data along connecting lines to a central fact node, in the shape of a star schema.</desc>
<style>
.d1{animation:d1 19s ease-in-out infinite alternate}
.d2{animation:d2 23s ease-in-out infinite alternate}
.d3{animation:d3 27s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(-70px,40px)}}
@keyframes d2{to{transform:translate(60px,-50px)}}
@keyframes d3{to{transform:translate(90px,30px)}}
.beam{fill:none;stroke-dasharray:16 104;stroke-dashoffset:120;animation:flow 7.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:0}}
.pulse{animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.beam{stroke-dashoffset:60}}
</style>
<defs>
