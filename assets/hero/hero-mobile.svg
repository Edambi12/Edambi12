<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF" stop-opacity=".45"/><stop offset=".5" stop-color="#94A3B8" stop-opacity=".12"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".45"/></linearGradient>
<radialGradient id="gc"><stop offset="0" stop-color="#00E5FF" stop-opacity=".30"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
